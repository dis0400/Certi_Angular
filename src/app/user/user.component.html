<div class="user-grid">
    <div *ngFor="let user of users" class="user-section">
      <div class="tabs">
        <button (click)="showUserInfo(user.user_id)" [class.active]="activeTabs[user.user_id] === 'user'">User</button>
        <button (click)="showNotifications(user.user_id)" [class.active]="activeTabs[user.user_id] === 'notifications'">
          Notifications ({{ getFilteredNotifications(user).length }})
        </button>
      </div>
  
      <div *ngIf="activeTabs[user.user_id] === 'user'">
        <h2>User Information</h2>
        <p><strong>Name:</strong> {{ user.name }}</p>
        <p><strong>Age:</strong> {{ user.age }}</p>
        <p><strong>Status:</strong> {{ user.status }}</p>
  
        <h3>Subscription Type</h3>
        <button [class.active]="user.subscriptionType === 'free'" (click)="toggleSubscription(user, 'free')">Free</button>
        <button [class.active]="user.subscriptionType === 'premium'" (click)="toggleSubscription(user, 'premium')">Premium</button>
  
        <p><strong>Amount Available:</strong> {{ user.amountAvailable }}$</p>
  
        <div class="social-networks">
          <h3>Social Networks</h3>
          <div class="network" *ngFor="let network of socialNetworks">
            <div *ngIf="!user.subscriptions.includes(network.id)">
              <span>{{ network.platform }}</span>
              <button (click)="subscribe(user, network)">+</button>
            </div>
          </div>
        </div>

        <div class="subscriptions">
          <h3>Subscriptions</h3>
          <div class="subscription" *ngFor="let sub of user.subscriptions">
            <span>{{ getPlatformName(sub) }}</span>
            <button (click)="unsubscribe(user, sub)">x</button>
          </div>
        </div>
      </div>
 
      <div *ngIf="activeTabs[user.user_id] === 'notifications'">
        <h2>Notifications</h2>
        <ul>
          <li *ngFor="let notification of getFilteredNotifications(user)">{{ notification }}</li>
        </ul>
      </div>
    </div>
  </div>
